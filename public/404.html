<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mega Revision Notes</title>
  <script>
    // GitHub Pages SPA redirect fix.
    // When GitHub Pages serves a 404 for a deep URL (e.g. /Mega_Notes/backend/rest-api),
    // it serves this 404.html. This script redirects back to the index with the path encoded.
    (function () {
      var segmentCount = 1; // number of path segments in base (1 for /Mega_Notes)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    })();
  </script>
</head>
<body>
  <p>Redirecting…</p>
</body>
</html>
