<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Grindboard — Company DSA Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');

:root{
  --bg: #0B0E14;
  --bg-raised: #12161F;
  --bg-card: #161B26;
  --bg-card-hover: #1B2130;
  --border: #232A38;
  --border-soft: #1C2230;
  --text: #E9E7E2;
  --text-dim: #9BA3B4;
  --text-faint: #5C6478;
  --accent: #FF7A3D;
  --accent-dim: #C75A28;
  --accent-glow: rgba(255,122,61,0.16);
  --teal: #4FA8B8;
  --teal-dim: #2E6472;
  --green: #4CAF7D;
  --green-dim: #2F6B4C;
  --red: #E15B5B;
  --yellow: #E0B94F;
  --radius: 10px;
}

*{box-sizing:border-box; margin:0; padding:0;}

html,body{
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  height: 100%;
  overflow: hidden;
}

::selection{ background: var(--accent-glow); color: var(--text); }

::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-track{ background: transparent; }
::-webkit-scrollbar-thumb{ background: var(--border); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover{ background: var(--text-faint); }

#root{ height:100vh; }

.mono{ font-family: 'JetBrains Mono', monospace; }

/* ===== Layout ===== */
.app{
  display: grid;
  grid-template-columns: 280px 1fr;
  height: 100vh;
}

/* ===== Sidebar ===== */
.sidebar{
  background: var(--bg-raised);
  border-right: 1px solid var(--border-soft);
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.brand{
  padding: 20px 18px 16px 18px;
  border-bottom: 1px solid var(--border-soft);
}

.brand-mark{
  display:flex;
  align-items: baseline;
  gap: 8px;
}

.brand-title{
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 17px;
  letter-spacing: -0.02em;
  color: var(--text);
}

.brand-title span{ color: var(--accent); }

.brand-sub{
  margin-top: 6px;
  font-size: 11.5px;
  color: var(--text-faint);
  line-height: 1.5;
}

.global-stats{
  padding: 14px 18px;
  border-bottom: 1px solid var(--border-soft);
}

.gs-row{
  display:flex;
  align-items:baseline;
  justify-content: space-between;
  margin-bottom: 8px;
}

.gs-label{ font-size: 11px; color: var(--text-faint); text-transform: none; letter-spacing: 0.01em; }
.gs-value{ font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; color: var(--text); }
.gs-value.accent{ color: var(--accent); }

.gs-bar-track{
  height: 6px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
  margin-top: 8px;
}
.gs-bar-fill{
  height: 100%;
  background: linear-gradient(90deg, var(--accent-dim), var(--accent));
  border-radius: 4px;
  transition: width 0.4s ease;
}

.save-row{
  display:flex;
  align-items:center;
  gap: 6px;
  margin-top: 10px;
}
.save-dot{
  width:7px; height:7px;
  border-radius:50%;
  background: var(--green);
  flex-shrink:0;
  transition: box-shadow 0.2s ease;
}
.save-dot.flash{
  box-shadow: 0 0 0 4px rgba(76,175,125,0.25);
}
.save-label{
  font-size: 10.5px;
  color: var(--text-faint);
  flex:1;
}
.save-actions{
  display:flex;
  gap: 6px;
}
.save-btn{
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 5px;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  transition: all 0.12s ease;
}
.save-btn:hover{
  border-color: var(--accent-dim);
  color: var(--accent);
}

.sidebar-search{
  padding: 10px 14px;
  border-bottom: 1px solid var(--border-soft);
}

.sidebar-search input{
  width: 100%;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  color: var(--text);
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  outline: none;
}
.sidebar-search input:focus{
  border-color: var(--accent-dim);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.sidebar-search input::placeholder{ color: var(--text-faint); }

.company-list{
  flex: 1;
  overflow-y: auto;
  padding: 6px 8px 16px 8px;
}

.company-item{
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: 8px;
  cursor: pointer;
  margin-bottom: 2px;
  transition: background 0.12s ease;
  position: relative;
}

.company-item:hover{ background: var(--bg-card-hover); }

.company-item.active{
  background: var(--bg-card);
}
.company-item.active::before{
  content: '';
  position: absolute;
  left: -8px;
  top: 6px;
  bottom: 6px;
  width: 3px;
  background: var(--accent);
  border-radius: 3px;
}

.company-ring{
  flex-shrink: 0;
  width: 30px;
  height: 30px;
}

.company-info{
  flex: 1;
  min-width: 0;
}

.company-name{
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.company-item.active .company-name{ color: var(--accent); font-weight: 600; }

.company-progress-text{
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  color: var(--text-faint);
  margin-top: 1px;
}

.no-results{
  padding: 20px 14px;
  color: var(--text-faint);
  font-size: 13px;
  text-align: center;
}

/* ===== Main ===== */
.main{
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
}

.main-header{
  padding: 22px 32px 16px 32px;
  border-bottom: 1px solid var(--border-soft);
  flex-shrink: 0;
}

.mh-top{
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
}

.mh-titlewrap{ min-width:0; }

.mh-eyebrow{
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--accent);
  letter-spacing: 0.02em;
  margin-bottom: 4px;
}

.mh-title{
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text);
}

.mh-progress-block{
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
}

.mh-ring{ width: 54px; height: 54px; }

.mh-progress-nums{
  text-align: right;
}
.mh-progress-count{
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
}
.mh-progress-count .slash{ color: var(--text-faint); font-weight: 500; }
.mh-progress-pct{
  font-size: 11.5px;
  color: var(--text-faint);
  margin-top: 2px;
}

.toolbar{
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 16px;
  flex-wrap: wrap;
}

.tb-search{
  flex: 1;
  min-width: 180px;
  position: relative;
}
.tb-search input{
  width: 100%;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 12px 9px 32px;
  color: var(--text);
  font-size: 13.5px;
  outline: none;
}
.tb-search input:focus{
  border-color: var(--accent-dim);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.tb-search input::placeholder{ color: var(--text-faint); }
.tb-search-icon{
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-faint);
  pointer-events: none;
}

select.tb-select{
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 10px;
  color: var(--text);
  font-size: 13px;
  outline: none;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
}
select.tb-select:focus{ border-color: var(--accent-dim); }

.tb-toggle{
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 12px;
  font-size: 12.5px;
  color: var(--text-dim);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
.tb-toggle.active{
  border-color: var(--accent-dim);
  color: var(--accent);
  background: var(--accent-glow);
}
.tb-toggle input{ display:none; }

.tb-checkbox{
  width: 14px; height:14px;
  border-radius: 4px;
  border: 1.5px solid var(--text-faint);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.tb-toggle.active .tb-checkbox{
  background: var(--accent);
  border-color: var(--accent);
}

/* ===== Problem list ===== */
.problem-scroll{
  flex: 1;
  overflow-y: auto;
  padding: 6px 32px 32px 32px;
}

.problem-table{
  width: 100%;
  border-collapse: collapse;
}

.problem-row{
  display: grid;
  grid-template-columns: 40px 1fr 110px 90px 100px 70px;
  align-items: center;
  gap: 12px;
  padding: 12px 12px;
  border-bottom: 1px solid var(--border-soft);
  transition: background 0.1s ease;
}

.problem-row:hover{ background: var(--bg-card); border-radius: 8px; }

.problem-row.header-row{
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 5;
}
.problem-row.header-row:hover{ background: var(--bg); }
.header-label{
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-faint);
  font-weight: 600;
}

.check-cell{
  display:flex;
  align-items:center;
  justify-content:center;
}

.checkbox{
  width: 20px; height: 20px;
  border-radius: 6px;
  border: 1.5px solid var(--text-faint);
  cursor: pointer;
  display:flex; align-items:center; justify-content:center;
  transition: all 0.12s ease;
  flex-shrink:0;
  background: transparent;
}
.checkbox:hover{ border-color: var(--accent); }
.checkbox.checked{
  background: var(--green-dim);
  border-color: var(--green);
}
.checkbox.checked svg{ display:block; }
.checkbox svg{ display:none; width:12px; height:12px; }

.prob-name-wrap{ min-width:0; }
.prob-name{
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow:hidden;
  text-overflow: ellipsis;
}
.prob-name.solved{ color: var(--text-dim); }
.prob-companies{
  font-size: 11px;
  color: var(--text-faint);
  margin-top: 2px;
  white-space: nowrap;
  overflow:hidden;
  text-overflow: ellipsis;
}

.badge{
  display: inline-flex;
  align-items:center;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  font-family: 'JetBrains Mono', monospace;
  width: fit-content;
}
.badge-easy{ color: var(--green); background: rgba(76,175,125,0.12); }
.badge-medium{ color: var(--yellow); background: rgba(224,185,79,0.12); }
.badge-hard{ color: var(--red); background: rgba(225,91,91,0.12); }

.pop-cell{ display:flex; align-items:center; gap: 6px; }
.pop-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.pop-veryhot .pop-dot{ background: var(--accent); box-shadow: 0 0 6px var(--accent); }
.pop-hot .pop-dot{ background: #E0954F; }
.pop-warm .pop-dot{ background: var(--teal); }
.pop-cold .pop-dot{ background: var(--text-faint); }
.pop-text{ font-size: 11.5px; color: var(--text-dim); }

.link-cell a{
  color: var(--text-faint);
  font-size: 11px;
  text-decoration: none;
  font-family: 'JetBrains Mono', monospace;
  border: 1px solid var(--border);
  padding: 3px 7px;
  border-radius: 5px;
  transition: all 0.12s ease;
}
.link-cell a:hover{
  color: var(--accent);
  border-color: var(--accent-dim);
}

.empty-state{
  text-align: center;
  padding: 60px 20px;
  color: var(--text-faint);
}
.empty-state-title{ font-size: 15px; color: var(--text-dim); margin-bottom: 6px; }
.empty-state-sub{ font-size: 12.5px; }

@media (max-width: 860px){
  .app{ grid-template-columns: 1fr; }
  .sidebar{ display:none; }
}
</style>
</head>

"name":"Coin Change","difficulty":"Medium","popularity":"Warm"},{"key":"implement queue using stacks","name":"Implement Queue using Stacks","difficulty":"Easy","popularity":"Warm"},{"key":"merge intervals","name":"Merge Intervals","difficulty":"Medium","popularity":"Warm"},{"key":"rotate array","name":"Rotate Array","difficulty":"Medium","popularity":"Warm"},{"key":"check for balanced parentheses in an expression","name":"Check for Balanced Parentheses in an Expression","difficulty":"Easy","popularity":"Hot"},{"key":"print pattern pyramid of numbers","name":"Print Pattern - Pyramid of Numbers","difficulty":"Easy","popularity":"Very Hot"},{"key":"check whether a number is palindrome or not","name":"Check Whether a Number is Palindrome or Not","difficulty":"Easy","popularity":"Hot"},{"key":"program to check armstrong number","name":"Program to Check Armstrong Number","difficulty":"Easy","popularity":"Hot"},{"key":"check for prime number","name":"Check for Prime Number","difficulty":"Easy","popularity":"Hot"},{"key":"factorial of a number","name":"Factorial of a Number","difficulty":"Easy","popularity":"Hot"},{"key":"gcd and lcm of two numbers","name":"GCD and LCM of Two Numbers","difficulty":"Easy","popularity":"Warm"},{"key":"sorting algorithms bubble selection insertion sort","name":"Sorting Algorithms - Bubble, Selection, Insertion Sort","difficulty":"Easy","popularity":"Very Hot"},{"key":"oop concepts inheritance and polymorphism","name":"OOP Concepts - Inheritance and Polymorphism","difficulty":"Easy","popularity":"Hot"},{"key":"count number of vowels and consonants in a string","name":"Count Number of Vowels and Consonants in a String","difficulty":"Easy","popularity":"Warm"},{"key":"check if two strings are anagrams","name":"Check if Two Strings are Anagrams","difficulty":"Easy","popularity":"Warm"},{"key":"find the kth smallest element in an unsorted array","name":"Find the Kth Smallest Element in an Unsorted Array","difficulty":"Medium","popularity":"Warm"},{"key":"longest common subsequence","name":"Longest Common Subsequence","difficulty":"Medium","popularity":"Warm"},{"key":"detect cycle in a directed graph","name":"Detect Cycle in a Directed Graph","difficulty":"Medium","popularity":"Warm"}]};

</script>

<script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;

const DIFF_ORDER = { Easy: 0, Medium: 1, Hard: 2 };
const POP_ORDER = { "Very Hot": 0, "Hot": 1, "Warm": 2, "Cold": 3 };
const POP_CLASS = { "Very Hot": "pop-veryhot", "Hot": "pop-hot", "Warm": "pop-warm", "Cold": "pop-cold" };

const COMPANY_NAMES = Object.keys(COMPANY_DATA).sort((a, b) => a.localeCompare(b));

// Build reverse index: problem key -> list of companies that ask it
const PROBLEM_COMPANIES = {};
COMPANY_NAMES.forEach(c => {
  COMPANY_DATA[c].forEach(p => {
    if (!PROBLEM_COMPANIES[p.key]) PROBLEM_COMPANIES[p.key] = [];
    PROBLEM_COMPANIES[p.key].push(c);
  });
});

// Build global distinct problem pool with best (highest) popularity/difficulty info for stats
const ALL_PROBLEMS = {};
COMPANY_NAMES.forEach(c => {
  COMPANY_DATA[c].forEach(p => {
    if (!ALL_PROBLEMS[p.key]) {
      ALL_PROBLEMS[p.key] = { key: p.key, name: p.name, difficulty: p.difficulty };
    }
  });
});
const TOTAL_DISTINCT = Object.keys(ALL_PROBLEMS).length;

function leetcodeSlug(name) {
  return name;
}

function CircleRing({ pct, size = 30, stroke = 3, color = "var(--accent)" }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const offset = c - (pct / 100) * c;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--border)" strokeWidth={stroke} />
      <circle
        cx={size/2} cy={size/2} r={r} fill="none"
        stroke={color} strokeWidth={stroke}
        strokeDasharray={c} strokeDashoffset={offset}
        strokeLinecap="round"
        transform={`rotate(-90 ${size/2} ${size/2})`}
        style={{ transition: "stroke-dashoffset 0.4s ease" }}
      />
    </svg>
  );
}

function CheckIcon() {
  return (
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M5 13l4 4L19 7" stroke="#0B0E14" strokeWidth="3.2" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function SearchIcon() {
  return (
    <svg className="tb-search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none">
      <circle cx="11" cy="11" r="7" stroke="currentColor" strokeWidth="2"/>
      <path d="M21 21l-4.3-4.3" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/>
    </svg>
  );
}

function App() {
  const [solved, setSolved] = useState({}); // key -> true
  const [loaded, setLoaded] = useState(false);
  const [activeCompany, setActiveCompany] = useState(COMPANY_NAMES[0]);
  const [sidebarSearch, setSidebarSearch] = useState("");
  const [search, setSearch] = useState("");
  const [difficultyFilter, setDifficultyFilter] = useState("All");
  const [popularityFilter, setPopularityFilter] = useState("All");
  const [hideSolved, setHideSolved] = useState(false);
  const [sortBy, setSortBy] = useState("popularity");
  const [saveFlash, setSaveFlash] = useState(false);

  const STORAGE_KEY = "grindboard-solved-problems-v1";
  const hasClaudeStorage = typeof window !== "undefined" && !!window.storage;

  // Load persisted solved state — prefer Claude's window.storage when running
  // inside an artifact preview, otherwise fall back to localStorage so the
  // standalone downloaded HTML file also persists across closes/refreshes.
  useEffect(() => {
    (async () => {
      try {
        if (hasClaudeStorage) {
          const res = await window.storage.get("solved-problems", false);
          if (res && res.value) {
            setSolved(JSON.parse(res.value));
          }
        } else {
          const raw = window.localStorage.getItem(STORAGE_KEY);
          if (raw) {
            setSolved(JSON.parse(raw));
          }
        }
      } catch (e) {
        // no saved state yet, or storage unavailable — start fresh
      }
      setLoaded(true);
    })();
  }, []);

  const persist = useCallback(async (next) => {
    try {
      if (hasClaudeStorage) {
        await window.storage.set("solved-problems", JSON.stringify(next), false);
      } else {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
      }
      setSaveFlash(true);
      setTimeout(() => setSaveFlash(false), 1200);
    } catch (e) {
      // storage failed silently; keep working in-memory for this session
    }
  }, []);

  const exportProgress = useCallback(() => {
    const blob = new Blob([JSON.stringify(solved, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "grindboard-progress.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, [solved]);

  const importInputRef = React.useRef(null);
  const triggerImport = useCallback(() => {
    if (importInputRef.current) importInputRef.current.click();
  }, []);
  const handleImportFile = useCallback((e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (parsed && typeof parsed === "object") {
          setSolved(parsed);
          persist(parsed);
        }
      } catch (err) {
        alert("Couldn't read that file — make sure it's a grindboard-progress.json export.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }, [persist]);

  const toggleSolved = useCallback((key) => {
    setSolved(prev => {
      const next = { ...prev };
      if (next[key]) {
        delete next[key];
      } else {
        next[key] = true;
      }
      persist(next);
      return next;
    });
  }, [persist]);

  const solvedCount = Object.keys(solved).length;
  const globalPct = TOTAL_DISTINCT ? Math.round((solvedCount / TOTAL_DISTINCT) * 100) : 0;

  const filteredCompanyNames = useMemo(() => {
    if (!sidebarSearch.trim()) return COMPANY_NAMES;
    const q = sidebarSearch.toLowerCase();
    return COMPANY_NAMES.filter(c => c.toLowerCase().includes(q));
  }, [sidebarSearch]);

  const companyProblems = COMPANY_DATA[activeCompany] || [];

  const companySolvedCount = useMemo(() => {
    return companyProblems.filter(p => solved[p.key]).length;
  }, [companyProblems, solved]);

  const companyPct = companyProblems.length ? Math.round((companySolvedCount / companyProblems.length) * 100) : 0;

  const displayedProblems = useMemo(() => {
    let list = companyProblems.slice();

    if (search.trim()) {
      const q = search.toLowerCase();
      list = list.filter(p => p.name.toLowerCase().includes(q));
    }
    if (difficultyFilter !== "All") {
      list = list.filter(p => p.difficulty === difficultyFilter);
    }
    if (popularityFilter !== "All") {
      list = list.filter(p => p.popularity === popularityFilter);
    }
    if (hideSolved) {
      list = list.filter(p => !solved[p.key]);
    }

    list.sort((a, b) => {
      if (sortBy === "popularity") return (POP_ORDER[a.popularity] ?? 9) - (POP_ORDER[b.popularity] ?? 9);
      if (sortBy === "difficulty") return (DIFF_ORDER[a.difficulty] ?? 9) - (DIFF_ORDER[b.difficulty] ?? 9);
      if (sortBy === "name") return a.name.localeCompare(b.name);
      if (sortBy === "solved") return (solved[b.key] ? 1 : 0) - (solved[a.key] ? 1 : 0);
      return 0;
    });

    return list;
  }, [companyProblems, search, difficultyFilter, popularityFilter, hideSolved, sortBy, solved]);

  function companyRingColor(pct) {
    if (pct === 100) return "var(--green)";
    if (pct > 0) return "var(--accent)";
    return "var(--border)";
  }

  function otherCompaniesLabel(key, currentCompany) {
    const list = PROBLEM_COMPANIES[key] || [];
    const others = list.filter(c => c !== currentCompany);
    if (others.length === 0) return null;
    if (others.length <= 3) return "Also: " + others.join(", ");
    return "Also: " + others.slice(0, 3).join(", ") + ` +${others.length - 3} more`;
  }

  return (
    <div className="app">
      <aside className="sidebar">
        <div className="brand">
          <div className="brand-mark">
            <span className="brand-title mono">grind<span>board</span></span>
          </div>
          <div className="brand-sub">Company-wise DSA tracker. Solve once, credited everywhere.</div>
        </div>

        <div className="global-stats">
          <div className="gs-row">
            <span className="gs-label">Distinct problems solved</span>
            <span className="gs-value accent mono">{solvedCount} / {TOTAL_DISTINCT}</span>
          </div>
          <div className="gs-bar-track">
            <div className="gs-bar-fill" style={{ width: globalPct + "%" }}></div>
          </div>
          <div className="save-row">
            <span className={"save-dot" + (saveFlash ? " flash" : "")}></span>
            <span className="save-label">{hasClaudeStorage ? "Synced" : "Saved to this browser"}</span>
            <div className="save-actions">
              <button className="save-btn" onClick={exportProgress} title="Download your progress as a backup file">Export</button>
              <button className="save-btn" onClick={triggerImport} title="Restore progress from a backup file">Import</button>
              <input ref={importInputRef} type="file" accept="application/json" style={{display:"none"}} onChange={handleImportFile} />
            </div>
          </div>
        </div>

        <div className="sidebar-search">
          <input
            placeholder="Filter companies…"
            value={sidebarSearch}
            onChange={e => setSidebarSearch(e.target.value)}
          />
        </div>

        <div className="company-list">
          {filteredCompanyNames.length === 0 && (
            <div className="no-results">No matching companies</div>
          )}
          {filteredCompanyNames.map(c => {
            const probs = COMPANY_DATA[c];
            const sc = probs.filter(p => solved[p.key]).length;
            const pct = probs.length ? Math.round((sc / probs.length) * 100) : 0;
            return (
              <div
                key={c}
                className={"company-item" + (c === activeCompany ? " active" : "")}
                onClick={() => setActiveCompany(c)}
              >
                <div className="company-ring">
                  <CircleRing pct={pct} size={30} stroke={3} color={companyRingColor(pct)} />
                </div>
                <div className="company-info">
                  <div className="company-name">{c}</div>
                  <div className="company-progress-text mono">{sc}/{probs.length} solved</div>
                </div>
              </div>
            );
          })}
        </div>
      </aside>

      <main className="main">
        <div className="main-header">
          <div className="mh-top">
            <div className="mh-titlewrap">
              <div className="mh-eyebrow mono">COMPANY</div>
              <div className="mh-title">{activeCompany}</div>
            </div>
            <div className="mh-progress-block">
              <div className="mh-progress-nums">
                <div className="mh-progress-count mono">
                  {companySolvedCount}<span className="slash">/{companyProblems.length}</span>
                </div>
                <div className="mh-progress-pct">{companyPct}% complete</div>
              </div>
              <div className="mh-ring">
                <CircleRing pct={companyPct} size={54} stroke={5} color={companyRingColor(companyPct)} />
              </div>
            </div>
          </div>

          <div className="toolbar">
            <div className="tb-search">
              <SearchIcon />
              <input
                placeholder="Search problems in this list…"
                value={search}
                onChange={e => setSearch(e.target.value)}
              />
            </div>
            <select className="tb-select" value={difficultyFilter} onChange={e => setDifficultyFilter(e.target.value)}>
              <option value="All">All difficulties</option>
              <option value="Easy">Easy</option>
              <option value="Medium">Medium</option>
              <option value="Hard">Hard</option>
            </select>
            <select className="tb-select" value={popularityFilter} onChange={e => setPopularityFilter(e.target.value)}>
              <option value="All">All popularity</option>
              <option value="Very Hot">Very Hot</option>
              <option value="Hot">Hot</option>
              <option value="Warm">Warm</option>
              <option value="Cold">Cold</option>
            </select>
            <select className="tb-select" value={sortBy} onChange={e => setSortBy(e.target.value)}>
              <option value="popularity">Sort: Popularity</option>
              <option value="difficulty">Sort: Difficulty</option>
              <option value="name">Sort: Name</option>
              <option value="solved">Sort: Solved first</option>
            </select>
            <label className={"tb-toggle" + (hideSolved ? " active" : "")}>
              <input type="checkbox" checked={hideSolved} onChange={e => setHideSolved(e.target.checked)} />
              <span className="tb-checkbox">{hideSolved ? "✓" : ""}</span>
              Hide solved
            </label>
          </div>
        </div>

        <div className="problem-scroll">
          <div className="problem-table">
            <div className="problem-row header-row">
              <div className="header-label"></div>
              <div className="header-label">Problem</div>
              <div className="header-label">Difficulty</div>
              <div className="header-label">Popularity</div>
              <div className="header-label">Also asked by</div>
              <div className="header-label">Link</div>
            </div>

            {displayedProblems.length === 0 && (
              <div className="empty-state">
                <div className="empty-state-title">No problems match your filters</div>
                <div className="empty-state-sub">Try clearing search or filters</div>
              </div>
            )}

            {displayedProblems.map(p => {
              const isSolved = !!solved[p.key];
              const others = otherCompaniesLabel(p.key, activeCompany);
              const popClass = POP_CLASS[p.popularity] || "pop-warm";
              const diffClass = "badge-" + p.difficulty.toLowerCase();
              const searchUrl = "https://leetcode.com/problemset/all/?search=" + encodeURIComponent(p.name);
              return (
                <div className="problem-row" key={p.key}>
                  <div className="check-cell">
                    <div
                      className={"checkbox" + (isSolved ? " checked" : "")}
                      onClick={() => toggleSolved(p.key)}
                      title={isSolved ? "Mark as unsolved" : "Mark as solved"}
                    >
                      <CheckIcon />
                    </div>
                  </div>
                  <div className="prob-name-wrap">
                    <div className={"prob-name" + (isSolved ? " solved" : "")}>{p.name}</div>
                    {others && <div className="prob-companies">{others}</div>}
                  </div>
                  <div>
                    <span className={"badge " + diffClass}>{p.difficulty}</span>
                  </div>
                  <div className={"pop-cell " + popClass}>
                    <span className="pop-dot"></span>
                    <span className="pop-text">{p.popularity}</span>
                  </div>
                  <div className="pop-text" style={{fontSize:'11px', color:'var(--text-faint)'}}>
                    {(PROBLEM_COMPANIES[p.key] || []).length} companies
                  </div>
                  <div className="link-cell">
                    <a href={searchUrl} target="_blank" rel="noopener noreferrer">Open ↗</a>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>

</body>
</html>
